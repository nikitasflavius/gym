<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Блокнот">
<meta name="theme-color" content="#1f3a5c">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Тренировочный блокнот</title>
<style>
:root{
  --bg:#f2f5f9;--surface:#ffffff;--surface2:#e8eef6;--ink:#16243a;--muted:#667689;--line:#d5dde8;
  --navy:#1f3a5c;--blue:#2a4d7a;--or:#ee6c3b;--or-ink:#ffffff;--or-soft:#fff1ea;--or-line:#f6c8b4;
  --ok:#2f9e6b;--ok-soft:#e3f3ea;--bad:#c2402b;--bad-soft:#fbe7e2;--star:#a2730c;--star-soft:#f6edd4;
  --hero:#2a4d7a;--hero-ink:#ffffff;
  --d-warm:#8d9db3;--d-easy:#3f9a97;--d-mid:#d9a92c;--d-hard:#ee6c3b;--d-fail:#c2402b;
  --shadow:0 1px 2px rgba(20,40,70,.08);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1724;--surface:#16233a;--surface2:#1e2f4a;--ink:#e8eef6;--muted:#94a5bb;--line:#2a3c58;
  --navy:#b8d0ee;--blue:#5b8cc6;--or:#f0794a;--or-ink:#1a0d06;--or-soft:#3a2317;--or-line:#6b3a24;
  --ok:#4cc58a;--ok-soft:#163726;--bad:#f0705a;--bad-soft:#3d1f19;--star:#e2b44a;--star-soft:#3a2f14;
  --hero:#1f3d66;--hero-ink:#ffffff;
  --d-warm:#7587a0;--d-easy:#4cb3af;--d-mid:#e2b44a;--d-hard:#f0794a;--d-fail:#e0583f;
  --shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#wrap{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px}
.chips{display:flex;gap:8px}
.chip{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 10px;min-width:0}
.chip small{display:block;font-size:10px;letter-spacing:.05em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-size:20px;color:var(--navy)}
.chip.rest{background:var(--or-soft);border-color:var(--or-line)}
.chip.rest b{color:var(--or)}
.chip.rest.over{background:var(--or);border-color:var(--or)}
.chip.rest.over small,.chip.rest.over b{color:var(--or-ink)}
body:not(.has-top) #top{padding:calc(6px + env(safe-area-inset-top,0px)) 0 0}
h1{font-size:26px;font-weight:800;color:var(--navy);margin:2px 0 12px;letter-spacing:-.01em}
h2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}
.date{font-size:13px;color:var(--muted);margin:6px 2px 0}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:16px}
.tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:10px;padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.05em}
.hero .big{font-size:32px;font-weight:800;margin:8px 0 2px}
.hero .big i{font-style:normal;color:#ffb89c}
.hero p{margin:0 0 14px;font-size:13px;opacity:.88}
.btn{display:block;width:100%;text-align:center;border-radius:14px;font-weight:800;font-size:16px;padding:14px 12px;background:var(--surface);border:1px solid var(--line);color:var(--blue)}
.btn.or{background:var(--or);border-color:var(--or);color:var(--or-ink)}
.btn.dis{opacity:.45}
.btn.sm{font-size:14px;padding:10px 12px;border-radius:12px;font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;box-shadow:var(--shadow)}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.crow .ltr{width:40px;height:40px;border-radius:12px;background:var(--surface2);color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.crow b{font-size:16px;color:var(--navy)}
.crow small{display:block;font-size:12px;color:var(--muted)}
.crow .go{margin-left:auto;color:var(--muted);font-size:20px}
.wcard .top{display:flex;align-items:center;gap:10px}
.wcard .val{font-size:30px;font-weight:800;color:var(--navy);padding:2px 6px;border-radius:10px}
.wcard .val small{font-size:14px;font-weight:600;color:var(--muted)}
.wcard .go{margin-left:auto;background:var(--ok);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800}
.wcard .go.done{background:var(--surface2);color:var(--muted)}
.wcard .avg{font-size:12.5px;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f)}
.recent{display:grid;gap:6px;margin-top:6px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:14px}
.rrow b{font-weight:800;color:var(--navy)} .rrow small{color:var(--muted);font-size:12.5px}
/* session */
.warm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:6px;width:100%;text-align:left}
.warm b{font-size:13px;color:var(--navy)} .warm p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.irow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.irow .st{width:24px;height:24px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.irow.done .st{background:var(--ok);color:#fff}
.irow.skip .st{background:var(--surface2)} .irow.skip .nm{text-decoration:line-through;color:var(--muted)}
.irow .nm{font-weight:700;color:var(--navy);line-height:1.25}
.irow .pg{font-size:12.5px;color:var(--muted)}
.lnk{border-left:4px solid var(--or)!important}
.lnk-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--or);margin-left:6px}
.ex{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.ex-img{width:56px;height:56px;border-radius:12px;overflow:hidden;flex:none;background:var(--surface2)}
.ex-img svg{width:100%;height:100%;display:block}
.ex .nm{font-size:17px;font-weight:800;color:var(--navy);line-height:1.2}
.ex .sch{font-size:12px;color:var(--muted);margin-top:3px}
.vars{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.vars button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.vars button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dots{display:flex;gap:5px;margin-top:10px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--surface2);max-width:60px}
.dots i.d{background:var(--blue)} .dots i.c{background:var(--or)} .dots i.x{background:var(--ok)}
.last{margin-top:10px;background:var(--bg);border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--muted);line-height:1.5}
.last b{color:var(--ink)}
.tech{margin-top:8px;font-size:12.5px;color:var(--muted)}
.tech .tb{color:var(--blue);font-weight:700;padding:4px 0}
.tech .big{margin-top:6px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tech .big svg{width:100%;height:auto;display:block}
.tech p{margin:6px 0 0}
.set{margin:14px 2px 0;font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--muted);display:flex;gap:8px;align-items:center}
.set .tt{background:var(--or-soft);color:var(--or);border-radius:8px;padding:2px 8px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-align:center}
.step small{font-size:11px;color:var(--muted);display:block;line-height:1.2;min-height:13px}
.step .n{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:4px}
.step .pm{width:42px;height:42px;border-radius:13px;background:var(--surface2);color:var(--navy);font-size:24px;font-weight:700;flex:none}
.step .v{flex:1;font-size:27px;font-weight:800;color:var(--navy);border-radius:10px;padding:2px 0}
.qw{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qw button{background:var(--surface2);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--blue)}
.qw button.on{background:var(--blue);color:#fff}
.qw .lb{font-size:11px;color:var(--muted);align-self:center;margin-right:2px}
.types{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.types button.on{background:var(--or-soft);border-color:var(--or-line);color:var(--or)}
.diff{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.diff button{border-radius:12px;padding:10px 0 9px;font-size:11px;font-weight:800;color:var(--ink);background:var(--surface);border:2px solid var(--c)}
.diff button.on{background:var(--c);color:#fff}
.diff button.on.d-mid{color:#3a2c05}
.d-warm{--c:#7d8fa7} .d-easy{--c:var(--d-easy)} .d-mid{--c:var(--d-mid)} .d-hard{--c:var(--d-hard)} .d-fail{--c:var(--d-fail)}
.dn{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sc{background:var(--surface2);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--navy)}
.sc.drop{box-shadow:inset 0 0 0 1.5px var(--or-line)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-size:13px;font-weight:700;color:var(--blue)}
.mini button.ask{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
/* summary */
.sum{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:16px}
.sum .k{font-size:11px;letter-spacing:.06em;opacity:.75}
.sum .bg{font-size:40px;font-weight:800;margin-top:4px}
.sum .bg small{font-size:14px;font-weight:600;opacity:.8}
.sum .s2{font-size:13px;opacity:.88;margin-top:2px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kp div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 10px}
.kp b{font-size:19px;color:var(--navy);display:block;white-space:nowrap}
.kp small{font-size:11px;color:var(--muted)}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.bar .t{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--blue);border-radius:5px}
.bar .t i.long{background:var(--or)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span:last-child{text-align:right;color:var(--muted)}
.syncline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:700;border-radius:12px;padding:10px 12px;background:var(--ok-soft);color:var(--ok)}
.syncline.wait{background:var(--star-soft);color:var(--star)} .syncline.off{background:var(--surface2);color:var(--muted)} .syncline.err{background:var(--bad-soft);color:var(--bad)}
.prs{margin-top:10px;font-size:13px;color:var(--ink)}
/* progress */
.prow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.prow b{font-size:14px;color:var(--navy);display:block;line-height:1.25}
.prow small{font-size:12px;color:var(--muted)}
.up{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:4px}
/* more */
.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 4px}
.sw{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 2px}
.sw button{width:50px;height:30px;border-radius:15px;background:var(--surface2);position:relative}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw button.on{background:var(--ok)} .sw button.on::after{left:23px}
.exl{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.exl small{color:var(--muted);font-size:12px}
.exl.arch{opacity:.5}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:5px 0;position:relative;font-weight:600}
#nav button.on{color:var(--navy);font-weight:800}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sdot{position:absolute;top:3px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--muted);border:2px solid var(--surface)}
.sdot.ok{background:var(--ok)} .sdot.wait{background:var(--d-mid)} .sdot.err{background:var(--bad)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,35,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.sh h3{margin:0 0 10px;font-size:18px;color:var(--navy)}
.sh .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sh .list{display:grid;gap:6px;margin-top:10px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.pick b{color:var(--navy);font-size:14px} .pick small{color:var(--muted);font-size:12px}
.pre{white-space:pre-wrap;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;max-height:200px;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.logrow{display:flex;gap:8px;margin-top:12px}
.logrow .btn.or{flex:1}
.logrow .dropb{width:auto;flex:none;padding:14px 16px;color:var(--or);border-color:var(--or-line);background:var(--or-soft)}
.sh .field input,.sh .field select,.sh .field textarea{margin-top:0}
.hero .btn.or{background:var(--or)}

</style>
</head>
<body>
<div id="wrap"><div id="top"></div><main id="app"></main></div>
<nav id="nav"></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* ====== Тренировочный блокнот · ядро: состояние, утилиты, логика ====== */

/* ---------- состояние ---------- */
function defState() {
  return {
    v: 1,
    cfg: { url: '', token: '', cycle: SEED.cycle, wStartDate: SEED.cfg.wStartDate, wStart: SEED.cfg.wStart, paceMin: SEED.cfg.paceMin, paceMax: SEED.cfg.paceMax, sound: true },
    pool: clone(SEED.pool), complexes: clone(SEED.complexes),
    log: [], weights: [], sessions: [], outbox: [], active: null, sync: { last: 0, err: '' }
  };
}
function loadState() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j && j.v === 1) { const d = defState(); return Object.assign(d, j, { cfg: Object.assign(d.cfg, j.cfg || {}), sync: Object.assign(d.sync, j.sync || {}) }); }
  } catch (e) { }
  return defState();
}
let S = loadState();
let saveFail = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveFail = false; }
  catch (e) { if (!saveFail) { saveFail = true; setTimeout(() => toast('Память телефона переполнена'), 0); } }
}

/* ---------- пул и индексы ---------- */
let POOLM = null, IDX = null;
function EX(id) {
  if (!POOLM) { POOLM = {}; S.pool.forEach(p => POOLM[p.id] = p); }
  return POOLM[id] || { id, name: id || '—', group: '', load: 'stack', metric: 'reps', step: 1, vg: '', icon: '', tech: '', arch: 0 };
}
function touchPool() { POOLM = null; }
function touchLog() { IDX = null; }
function idx() {
  if (IDX) return IDX;
  IDX = {};
  for (const r of S.log) (IDX[r.ex] || (IDX[r.ex] = [])).push(r);
  for (const k in IDX) IDX[k].sort((a, b) => a.ts - b.ts);
  return IDX;
}
const isWork = r => r.df !== 'разминка' && r.ty !== 'дроп';
const weff = (ex, w) => EX(ex).load === 'dumbbell' ? r2(w * 2) : w;
function e1of(rec) {
  const e = EX(rec.ex);
  if (rec.m === 'sec' || e.load === 'bodyweight' || !(rec.r > 0) || !(rec.we > 0)) return 0;
  return r1(rec.we * (1 + rec.r / 30));
}
function scoreOf(rec) {
  if (!isWork(rec)) return null;
  const e = EX(rec.ex);
  if (rec.m === 'sec') return rec.r;
  if (e.load === 'bodyweight') return rec.we * 1000 + rec.r;
  return rec.we * (1 + rec.r / 30);
}
function valOf(rec) { // для графиков
  const e = EX(rec.ex);
  if (rec.m === 'sec') return rec.r;
  if (e.load === 'bodyweight') return rec.we > 0 ? rec.we * (1 + rec.r / 30) : rec.r;
  return rec.we * (1 + rec.r / 30);
}
function exSessions(id, excludeSid) {
  const arr = (idx()[id] || []).filter(r => r.sid !== excludeSid);
  const m = new Map();
  for (const r of arr) { if (!m.has(r.sid)) m.set(r.sid, { sid: r.sid, d: r.d, ts: r.ts, sets: [] }); m.get(r.sid).sets.push(r); }
  return [...m.values()].sort((a, b) => a.ts - b.ts);
}
function setsOf(sid, id) { return (idx()[id] || []).filter(r => r.sid === sid); }
function bestRec(id, excludeSid) {
  let best = null, bs = -1;
  for (const r of (idx()[id] || [])) { if (r.sid === excludeSid) continue; const s = scoreOf(r); if (s != null && s > bs) { bs = s; best = r; } }
  return best;
}
function lastVariant(ex) {
  const e = EX(ex);
  if (!e.vg) return ex;
  const vs = S.pool.filter(p => p.vg === e.vg && !p.arch).map(p => p.id);
  let last = null;
  for (const id of vs) { const a = idx()[id]; if (a && a.length) { const t = a[a.length - 1]; if (!last || t.ts > last.ts) last = t; } }
  return last ? last.ex : ex;
}
function variantsOf(ex) {
  const e = EX(ex);
  if (!e.vg) return [];
  return S.pool.filter(p => p.vg === e.vg && !p.arch);
}
const cxOf = key => S.complexes.find(c => c.key === key);
const cxName = key => key === 'F' ? 'Свободная' : (cxOf(key) ? cxOf(key).name : key);
const cxLabel = key => key === 'F' ? 'Свободная тренировка' : (cxOf(key) ? key + ' · ' + cxOf(key).name : key);

/* ---------- ротация A→B→C ---------- */
function nextComplex() {
  const keys = S.complexes.map(c => c.key);
  if (!keys.length) return null;
  const fin = S.sessions.filter(s => s.fin && s.cx !== 'F' && keys.includes(s.cx)).sort((a, b) => a.start - b.start);
  if (!fin.length) return keys[0];

function lastSessionOf(cx) {

  return f[0] || null;
}
function estMin(cx) {
  const f = S.sessions.filter(s => s.fin && s.cx === cx && s.min > 20).sort((a, b) => b.start - a.start).slice(0, 3);
  if (!f.length) return 75;
  return Math.round(f.reduce((a, s) => a + s.min, 0) / f.length);
}

/* ---------- черновик подхода ---------- */
function prefill(it, id, k, done) {
  const e = EX(id);
  const ses = exSessions(id, S.active ? S.active.sid : '');
  const hs = ses.length ? ses[ses.length - 1].sets.filter(isWork) : [];
  const wk = done.filter(isWork);
  let src = null;
  if (wk.length) { const h1 = hs[0]; src = (hs[k - 1] && h1 && wk[0].w === h1.w) ? hs[k - 1] : wk[wk.length - 1]; }
  else src = hs[k - 1] || hs[hs.length - 1] || null;
  return {
    w: src ? src.w : 0,
    r: src ? src.r : (e.metric === 'sec' ? 30 : it.rmin),
    ty: 'норм',
    df: src ? (src.df === 'разминка' ? 'средне' : src.df) : 'средне'
  };
}
function draft(it) {
  const A = S.active, id = it.use || it.ex;

  const key = id + ':' + done.length;
  if (it.d && it.dk === key) return it.d;

}
function histWeights(id) {
  const ses = exSessions(id, S.active ? S.active.sid : '').slice(-3);
  const set = new Set();
  for (const s of ses) for (const r of s.sets) if (isWork(r) && r.w > 0) set.add(r.w);
  return [...set].sort((a, b) => b - a).slice(0, 5);

  if (hs.length < it.sets) return false;

/* ---------- сессия ---------- */
function startSession(key) {
  const now = nowS(), dt = new Date(now);

    const c = cxOf(key);

  }
  const A = {
    sid: 's-' + dstr(now).replace(/-/g, '') + '-' + pad(dt.getHours()) + pad(dt.getMinutes()) + pad(dt.getSeconds()), cx: key, cyc: S.cfg.cycle,
    d: dstr(now), start: now, warmEnd: 0, items, cur: 0, restStart: 0, restPlan: 0, beeped: false
  };

}

let syncing = false, pulling = false;

function setPayload(rec) {

function qop(op) {

  const same = o => {
    if (op.op === 'set' || op.op === 'delset') return (o.op === 'set' || o.op === 'delset') && o.id === op.id;
    if (op.op === 'weight') return o.op === 'weight' && o.d === op.d;
    if (op.op === 'session') return o.op === 'session' && o.s.sid === op.s.sid;
    if (op.op === 'exercise') return o.op === 'exercise' && o.ex.id === op.ex.id;

}

function qSession(s) { qop({ op: 'session', s: Object.assign({}, s) }); }

function syncState() {
  if (!S.cfg.url || !S.cfg.token) return 'off';
  if (S.sync.err) return 'err';
  if (S.outbox.length) return 'wait';
  return 'ok';
}
function syncText() {
  const st = syncState();
  if (st === 'off') return 'Таблица не подключена — данные хранятся только в телефоне';
  if (st === 'err') return 'Не удалось отправить: ' + S.sync.err + '. В очереди: ' + S.outbox.length;
  if (st === 'wait') return 'В очереди на отправку: ' + S.outbox.length + (navigator.onLine ? '' : ' (нет сети)');
  return 'Всё сохранено в таблице' + (S.sync.last ? ' · ' + new Date(S.sync.last).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '');
}
async function post(payload) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow', signal: ctl.signal });
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { throw new Error('ответ не похож на ответ скрипта'); }
  } finally { clearTimeout(t); }
}
async function flush() {
  if (syncing) return;

  syncing = true;
  try {
    while (S.outbox.length) {
      const batch = S.outbox.slice(0, 30);
      const res = await post({ token: S.cfg.token, ops: batch });
      if (!res || !res.ok) throw new Error((res && res.error) || 'ошибка скрипта');
      const done = new Set(batch.map(o => o.oid));
      S.outbox = S.outbox.filter(o => !done.has(o.oid));
      const m = new Map(S.log.map(r => [r.id, r]));
      for (const o of batch) if (o.op === 'set') { const r = m.get(o.id); if (r && !S.outbox.some(x => x.op === 'set' && x.id === o.id)) r.sy = 1; }
      S.sync.err = ''; S.sync.last = Date.now();
      save();
    }
  } catch (e) {
    S.sync.err = (e && e.name === 'AbortError') ? 'долгий ответ' : String((e && e.message) || e);
  } finally { syncing = false; save(); uiSync(); }
}

async function pull(manual) {
  if (pulling || !S.cfg.url || !S.cfg.token || !navigator.onLine) return false;
  pulling = true;
  try {
    const u = S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'action=pull&token=' + encodeURIComponent(S.cfg.token);
    const r = await fetch(u, { redirect: 'follow' });
    const j = JSON.parse(await r.text());
    if (!j.ok) throw new Error(j.error || 'ошибка');
    mergePull(j);
    S.sync.err = ''; S.sync.last = Date.now();
    save(); touchLog(); touchPool();
    if (manual) toast('Обновлено из таблицы');
    return true;
  } catch (e) {
    S.sync.err = String((e && e.message) || e);
    if (manual) toast('Не получилось: ' + S.sync.err);
    return false;
  } finally { pulling = false; save(); render(); }
}

function mergePull(j) {
  const ob = S.outbox;
  const pendSet = new Set(ob.filter(o => o.op === 'set' || o.op === 'delset').map(o => o.id));
  const pendW = new Set(ob.filter(o => o.op === 'weight').map(o => o.d));
  const pendS = new Set(ob.filter(o => o.op === 'session').map(o => o.s.sid));
  const pendE = new Set(ob.filter(o => o.op === 'exercise').map(o => o.ex.id));
  const pendProg = ob.some(o => o.op === 'program');
  const activeSid = S.active ? S.active.sid : '';

  if (j.cfg) {
    ['cycle', 'wStart', 'paceMin', 'paceMax'].forEach(k => { if (j.cfg[k] != null && j.cfg[k] !== '' && !isNaN(+j.cfg[k])) S.cfg[k] = +j.cfg[k]; });
    if (j.cfg.wStartDate) S.cfg.wStartDate = String(j.cfg.wStartDate);
  }
  if (j.pool && j.pool.length) {
    const sheet = j.pool.map(p => Object.assign({}, p, { step: +p.step || 1, arch: p.arch ? 1 : 0 }));
    const have = new Set(sheet.map(p => p.id));
    const keep = S.pool.filter(p => !have.has(p.id) && pendE.has(p.id));
    const loc = new Map(S.pool.map(p => [p.id, p]));
    S.pool = sheet.map(p => pendE.has(p.id) && loc.has(p.id) ? loc.get(p.id) : p).concat(keep);
  }
  if (j.complexes && j.complexes.length && !pendProg) S.complexes = j.complexes;

  if (j.log) {
    const loc = new Map(S.log.map(r => [r.id, r]));
    const seen = new Set();
    let oldest = Infinity;
    for (const r of j.log) {
      seen.add(r.id); oldest = Math.min(oldest, r.ts);
      if (pendSet.has(r.id)) continue;
      loc.set(r.id, Object.assign({}, r, { sy: 1 }));
    }
    S.log = [...loc.values()].filter(r => seen.has(r.id) || !r.sy || pendSet.has(r.id) || r.sid === activeSid || r.ts < oldest).sort((a, b) => a.ts - b.ts);
  }
  if (j.weights) {
    const loc = new Map(S.weights.map(w => [w.d, w]));
    const seen = new Set(); let oldest = '9999';
    for (const w of j.weights) { seen.add(w.d); if (w.d < oldest) oldest = w.d; if (pendW.has(w.d)) continue; loc.set(w.d, { d: w.d, w: +w.w, sy: 1 }); }
    S.weights = [...loc.values()].filter(w => seen.has(w.d) || !w.sy || pendW.has(w.d) || w.d < oldest).sort((a, b) => a.d < b.d ? -1 : 1);
  }
  if (j.sessions) {
    const loc = new Map(S.sessions.map(s => [s.sid, s]));
    for (const s of j.sessions) { if (pendS.has(s.sid)) continue; loc.set(s.sid, Object.assign({}, loc.get(s.sid) || {}, s, { fin: 1 })); }
    S.sessions = [...loc.values()].sort((a, b) => a.start - b.start);
  }
}

/* ====== Импорт программы из текста ====== */
function normName(s) { return String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]+/g, ' ').trim(); }
const LOADMAP = { 'штанга': 'barbell', 'гантель': 'dumbbell', 'гантели': 'dumbbell', 'смит': 'smith', 'тренажер': 'stack', 'тренажёр': 'stack', 'блок': 'stack', 'вес тела': 'bodyweight', 'свой вес': 'bodyweight', 'barbell': 'barbell', 'dumbbell': 'dumbbell', 'smith': 'smith', 'stack': 'stack', 'bodyweight': 'bodyweight' };
function nextExId(extra) {
  let m = 0;
  S.pool.concat(extra || []).forEach(p => { const n = parseInt(String(p.id).replace(/\D/g, ''), 10); if (n > m) m = n; });
  return 'e' + pad(m + 1);
}
function parseProgram(text) {
  const out = { cycle: S.cfg.cycle, complexes: [], newEx: [], errors: [], warns: [] };
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(l => l);
  // 1) определения новых упражнений
  for (const l of lines) {
    if (l[0] !== '+') continue;
    const p = l.slice(1).split(';').map(x => x.trim());
    if (!p[0]) { out.errors.push('Пустое имя в строке: ' + l); continue; }
    const load = LOADMAP[(p[2] || 'тренажёр').toLowerCase()];
    if (!load) { out.errors.push('Неизвестный тип нагрузки «' + p[2] + '» в: ' + l); continue; }
    const metric = /сек/i.test(p[3] || '') ? 'sec' : 'reps';
    const step = parseNum(p[4] || '') || (load === 'barbell' ? 2.5 : 1);
    out.newEx.push({ id: nextExId(out.newEx), name: p[0], group: p[1] || '', load, metric, step, vg: '', icon: '', tech: '', arch: 0 });
  }
  const all = S.pool.concat(out.newEx);
  const find = nm => {
    const n = normName(nm);
    let f = all.filter(p => normName(p.name) === n);
    if (f.length === 1) return f[0];
    if (f.length > 1) { const a = f.filter(p => !p.arch); if (a.length === 1) return a[0]; }
    f = all.filter(p => normName(p.name).startsWith(n) || n.startsWith(normName(p.name)));
    return f.length === 1 ? f[0] : null;
  };
  let cur = null;
  for (const l of lines) {
    if (l[0] === '+') continue;
    let m;
    if ((m = l.match(/^цикл\s*(\d+)/i))) { out.cycle = +m[1]; continue; }
    if (l[0] === '#') {
      const p = l.slice(1).split('·').map(x => x.trim());
      const key = p[0];
      const old = cxOf(key);
      cur = { key, name: p[1] || (old ? old.name : key), sub: p.slice(2).join(' · ') || (old ? old.sub : ''), warm: old ? old.warm : '', items: [] };
      out.complexes.push(cur);
      continue;
    }
    if (/^разминка\s*:/i.test(l)) { if (cur) cur.warm = l.replace(/^разминка\s*:/i, '').trim(); continue; }
    if (!cur) { out.warns.push('Строка вне комплекса пропущена: ' + l); continue; }
    const p = l.split(';').map(x => x.trim());
    const e = find(p[0]);
    if (!e) { out.errors.push('Не нашёл упражнение «' + p[0] + '» — добавь его строкой «+ Название; Группа; тип; метрика; шаг»'); continue; }
    const sets = parseInt(p[1], 10);
    if (!sets) { out.errors.push('Нет числа подходов у «' + p[0] + '»'); continue; }
    const rg = String(p[2] || '').match(/(\d+)\s*[-–—]\s*(\d+)/);
    const rmin = rg ? +rg[1] : (parseInt(p[2], 10) || 8), rmax = rg ? +rg[2] : rmin;
    let rest = 90; const rs = String(p[3] || '');
    if (/^\d+:\d+$/.test(rs)) { const [a, b] = rs.split(':').map(Number); rest = a * 60 + b; }
    else if (parseNum(rs) != null) { const v = parseNum(rs); rest = v <= 10 ? Math.round(v * 60) : Math.round(v); }
    else out.warns.push('Отдых не указан у «' + e.name + '» — поставил 1:30');
    let grp = ''; const g = (p[4] || '').match(/связка\s*(\w+)/i); if (g) grp = g[1];
    cur.items.push({ ex: e.id, sets, rmin, rmax, rest, grp });
  }
  if (!out.complexes.length) out.errors.push('Не нашёл ни одного комплекса. Начни с «# A · Жим · подпись».');
  out.complexes.forEach(c => { if (!c.items.length) out.errors.push('Комплекс ' + c.key + ' пустой'); });
  return out;
}
function applyProgram(pr) {
  for (const e of pr.newEx) { S.pool.push(e); qop({ op: 'exercise', ex: Object.assign({}, e) }); }
  S.complexes = pr.complexes; S.cfg.cycle = pr.cycle;
  touchPool();
  qop({ op: 'program', cycle: pr.cycle, complexes: clone(pr.complexes) });
}

/* линейный график: series=[{pts:[[x,y]],color,dash,width}] , band={lo:[[x,y]],hi:[[x,y]]} */
function lineChart(series, band, W = 340, H = 150, xl) {
  const all = series.flatMap(s => s.pts).concat(band ? band.lo.concat(band.hi) : []);
  if (all.length < 2) return '<div class="hint">Пока мало данных для графика</div>';
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x1 === x0) x1 = x0 + 1; if (y1 === y0) { y0 -= 1; y1 += 1; }
  const pd = (y1 - y0) * 0.12; y0 -= pd; y1 += pd;
  const L = 34, R = 8, T = 8, B = 18;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = Y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 4) + '" y="' + (y + 3) + '" text-anchor="end">' + fn(r1(v)) + '</text>'; }
  if (band) {
    const top = band.hi.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1));
    const bot = band.lo.slice().reverse().map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1));
    g += '<polygon points="' + top.concat(bot).join(' ') + '" fill="var(--ok)" opacity=".18"/>';
  }

    if (s.dots) g += s.pts.map(p => '<circle cx="' + X(p[0]).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="' + (s.r || 3) + '" fill="' + s.color + '"/>').join('');
    if (!s.dots || s.pts.length > 1) g += '<polyline fill="none" stroke="' + s.color + '" stroke-width="' + (s.width || 2) + '" ' + (s.dash ? 'stroke-dasharray="4 3" ' : '') + 'stroke-linejoin="round" stroke-linecap="round" points="' + pts + '"/>';
  }
  if (xl) g += '<text x="' + L + '" y="' + (H - 3) + '">' + esc(xl[0]) + '</text><text x="' + (W - R) + '" y="' + (H - 3) + '" text-anchor="end">' + esc(xl[1]) + '</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">' + g + '</svg>';
}

  let h = '<div class="date">' + DOW[new Date().getDay()] + ', ' + dlabel(dstr()) + ' · цикл ' + S.cfg.cycle + '</div><h1>Тренировка</h1>';
  h += weightCard();
  if (A) {
    const n = sessionRows(A.sid).length;
    h += '<h2>Сейчас идёт</h2><div class="hero"><span class="tag">В ПРОЦЕССЕ</span><div class="big">' + esc(cxLabel(A.cx)) + '</div><p>Подходов записано: ' + n + '</p><button class="btn or" data-a="resume">Продолжить</button></div>';
  } else if (nxt) {

    h += '<h2>Следующая по очереди</h2><div class="hero"><span class="tag">ЦИКЛ ' + S.cfg.cycle + '</span><div class="big">' + esc(nxt) + ' · <i>' + esc(c.name) + '</i></div>' +
      '<p>' + c.items.length + ' упр. · около ' + estMin(nxt) + ' мин · ' + (ls ? 'прошлый раз ' + dlabel(ls.d) : 'ещё не делал в этом цикле') + '</p>' +
      '<button class="btn or" data-a="start" data-v="' + esc(nxt) + '">Начать тренировку</button></div>';
  }
  if (!A) {
    const others = S.complexes.filter(c => c.key !== nxt);

    for (const c of others) {
      const ls = lastSessionOf(c.key);
      h += '<div class="card"><button class="crow" data-a="start" data-v="' + esc(c.key) + '"><span class="ltr">' + esc(c.key) + '</span><span><b>' + esc(c.name) + '</b><small>' + (ls ? 'последний раз ' + dlabel(ls.d) : 'ещё не делал') + '</small></span><span class="go">›</span></button></div>';
    }

  }
  const rec = S.sessions.filter(s => s.fin).sort((a, b) => b.start - a.start).slice(0, 5);
  if (rec.length) {
    h += '<h2>Последние</h2><div class="recent">';
    for (const s of rec) h += '<button class="rrow" data-a="opensum" data-v="' + esc(s.sid) + '"><b>' + dlabel(s.d) + '</b><span>' + esc(s.cx === 'F' ? 'Свободная' : s.cx + ' · ' + cxName(s.cx)) + ' <small>' + s.sets + ' подх.' + (s.prs ? ' · 🏆' + s.prs : '') + '</small></span><small class="num">' + (s.min > 0 ? s.min + ' мин' : '') + '</small></button>';
    h += '</div>';
  }
  h += '<div class="syncline ' + syncState() + '" id="syncline">' + esc(syncText()) + '</div>';
  return h;
}

/* ---------- экран тренировки ---------- */
function viewSession() {
  const A = S.active;
  let h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><h1 style="margin:2px 0">' + esc(cxLabel(A.cx)) + '</h1></div>';
  const anySets = sessionRows(A.sid).length > 0;
  const c = cxOf(A.cx);
  if (c && c.warm && !A.warmEnd && !anySets) {
    h += '<div class="warm"><b>Разминка · ~7 мин</b><p>' + esc(c.warm) + '</p><button class="btn sm or" style="margin-top:10px" data-a="warmdone">Разминка готова</button></div>';
  } else if (c && c.warm && A.warmEnd) {
    h += '<div class="hint" style="margin-top:4px">Разминка закончена в ' + new Date(A.warmEnd).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + '</div>';
  }

  h += '<button class="btn or" style="margin-top:10px" data-a="finish">Завершить тренировку</button>';
  return h;
}
function itemRow(i) {
  const A = S.active, it = A.items[i], id = it.use || it.ex, e = EX(id);
  const done = itemDone(A, it), w = itemWork(A, it);
  const sets = setsOf(A.sid, id).filter(isWork);
  const last = sets.length ? sets[sets.length - 1] : null;
  return '<button class="irow ' + (it.skip ? 'skip ' : (w >= it.sets ? 'done ' : '')) + (it.grp ? 'lnk' : '') + '" data-a="open" data-i="' + i + '">' +
    '<span class="st">' + (it.skip ? '–' : (w >= it.sets ? '✓' : (i + 1))) + '</span>' +
    '<span><span class="nm">' + esc(e.name) + '</span>' + (it.grp ? '<span class="lnk-tag">СВЯЗКА</span>' : '') + (it.rep ? '<span class="lnk-tag" style="color:var(--blue)">ЗАМЕНА</span>' : '') +
    '<br><span class="pg">' + (it.skip ? 'пропущено' : w + ' / ' + it.sets + (last ? ' · ' + fn(last.w) + '×' + last.r : '')) + '</span></span>' +
    '<span class="pg num">' + (it.skip ? '' : mmss(it.rest)) + '</span></button>';
}
function wLabel(e) {
  switch (e.load) {
    case 'barbell': return 'ВЕС · КГ (ВМЕСТЕ С ГРИФОМ)';
    case 'dumbbell': return 'ОДНА ГАНТЕЛЬ · КГ';
    case 'smith': return 'БЛИНЫ · КГ';
    case 'bodyweight': return 'ДОП. ВЕС · КГ';
    default: return 'ВЕС · КГ';
  }
}
function exCard(i) {
  const A = S.active, it = A.items[i], id = it.use || it.ex, e = EX(id);
  const d = draft(it), done = setsOf(A.sid, id);
  const work = done.filter(isWork).length;
  const sec = e.metric === 'sec';
  const ses = exSessions(id, A.sid), lastS = ses.length ? ses[ses.length - 1] : null;
  let h = '<div class="ex" id="ex"><div class="ex-h"><div class="ex-img">' + exIcon(e) + '</div><div style="min-width:0;flex:1"><div class="nm">' + esc(e.name) + '</div>' +
    '<div class="sch">' + it.sets + ' × ' + it.rmin + (it.rmax !== it.rmin ? '–' + it.rmax : '') + (sec ? ' с' : '') + ' · отдых ' + mmss(it.rest) + (it.grp ? ' · связка' : '') + '</div>' +
    (it.rep ? '<div class="sch">вместо: ' + esc(EX(it.ex).name) + '</div>' : '') +
    (progressUp(it) ? '<span class="up" style="margin:4px 0 0">↑ повышай вес</span>' : '') + '</div></div>';
  const vs = variantsOf(it.ex);
  if (vs.length > 1 && !it.rep) h += '<div class="vars">' + vs.map(v => '<button class="' + (v.id === id ? 'on' : '') + '" data-a="variant" data-v="' + v.id + '">' + esc(v.name.replace(/^.*?\s(в|на)\s/, '')) + '</button>').join('') + '</div>';
  h += '<div class="dots">' + Array.from({ length: Math.max(it.sets, work) }, (_, k) => '<i class="' + (k < work ? (k < it.sets ? 'd' : 'x') : (k === work ? 'c' : '')) + '"></i>').join('') + '</div>';
  if (lastS) {
    const best = bestRec(id, A.sid);
    const parts = lastS.sets.filter(r => r.df !== 'разминка').map(r => '<b>' + fn(r.w) + '×' + r.r + (sec ? 'с' : '') + '</b>' + (r.ty === 'дроп' ? '↓' : '')).join(' · ');
    h += '<div class="last">Прошлый раз · ' + dlabel(lastS.d) + ': ' + parts + (best && best.e1 ? '<br>Лучший: ' + fn(best.w) + '×' + best.r + ' (1ПМ ≈ ' + fn(best.e1) + ')' : '') + '</div>';
  } else h += '<div class="last">Раньше это упражнение не записывалось — введи вес сам.</div>';
  if (e.tech || BIG[e.icon]) {
    const open = !!UI.tech[id];
    h += '<div class="tech"><button class="tb" data-a="tech" data-v="' + id + '">Как делать ' + (open ? '▴' : '▾') + '</button>' +
      (open ? (BIG[e.icon] ? '<div class="big">' + BIG[e.icon] + '</div>' : '') + (e.tech ? '<p>' + esc(e.tech) + '</p>' : '') : '') + '</div>';
  }
  const isDrop = d.ty === 'дроп';
  h += '<div class="set">ПОДХОД ' + (work + (d.df === 'разминка' ? 0 : 1)) + (isDrop ? ' <span class="tt">ДРОП</span>' : '') + (d.df === 'разминка' ? ' <span class="tt">РАЗМИНОЧНЫЙ</span>' : '') + '</div>';
  const wv = d.w > 0 || e.load === 'bodyweight' ? (d.w > 0 ? fn(d.w) : 'своё') : '—';
  h += '<div class="steps"><div class="step"><small>' + wLabel(e) + '</small><div class="n"><button class="pm" data-a="wstep" data-v="-1" aria-label="меньше">−</button><button class="v num" data-a="wnum">' + wv + '</button><button class="pm" data-a="wstep" data-v="1" aria-label="больше">+</button></div>' +
    '<small>' + (e.load === 'dumbbell' && d.w > 0 ? '2 × ' + fn(d.w) + ' = ' + fn(d.w * 2) + ' кг' : '&nbsp;') + '</small></div>' +
    '<div class="step"><small>' + (sec ? 'СЕКУНДЫ' : 'ПОВТОРЫ') + '</small><div class="n"><button class="pm" data-a="rstep" data-v="-1" aria-label="меньше">−</button><button class="v num" data-a="rnum">' + d.r + '</button><button class="pm" data-a="rstep" data-v="1" aria-label="больше">+</button></div><small>&nbsp;</small></div></div>';
  const hw = histWeights(id);
  if (hw.length) h += '<div class="qw"><span class="lb">из истории</span>' + hw.map(w => '<button class="' + (w === d.w ? 'on' : '') + '" data-a="qw" data-v="' + w + '">' + fn(w) + '</button>').join('') + '</div>';
  h += '<div class="types">' + TYPES.map(t => '<button class="' + (d.ty === t ? 'on' : '') + '" data-a="ty" data-v="' + t + '">' + t + '</button>').join('') + (isDrop ? '<button class="on" data-a="ty" data-v="норм">дроп ✕</button>' : '') + '</div>';
  h += '<div class="diff">' + DF.map(k => '<button class="d-' + DFC[k] + ' ' + (d.df === k ? 'on' : '') + '" data-a="df" data-v="' + k + '"><span>' + k + '</span></button>').join('') + '</div>';
  h += '<div class="logrow"><button class="btn or" data-a="log">' + (isDrop ? 'Записать дроп' : 'Записать подход') + '</button>' + (done.length && !isDrop ? '<button class="btn dropb" data-a="drop">+ дроп</button>' : '') + '</div>';
  if (done.length) h += '<div class="dn">' + done.map(r => '<button class="sc ' + (r.ty === 'дроп' ? 'drop' : '') + '" data-a="editset" data-v="' + r.id + '">' + (r.ty === 'дроп' ? '↓ ' : '') + fn(r.w) + '×' + r.r + (r.m === 'sec' ? 'с' : '') + (r.df === 'разминка' ? ' р' : '') + (r.pr ? ' 🏆' : '') + '</button>').join('') + '</div>';
  h += '<div class="mini"><button data-a="replace">Заменить</button><button class="' + (UI.ask === 'skip' ? 'ask' : '') + '" data-a="skip">' + (UI.ask === 'skip' ? 'Точно?' : 'Пропустить') + '</button><button data-a="note">Заметка' + (it.note || it.pnote ? ' •' : '') + '</button></div>';
  if (itemWork(A, it) >= it.sets) h += '<button class="btn sm" style="margin-top:10px" data-a="next">К следующему упражнению ›</button>';
  return h + '</div>';
}

/* ---------- итог тренировки ---------- */
function viewSummary(sid) {
  const s = S.sessions.find(x => x.sid === sid);
  if (!s) return '<h1>Не нашёл тренировку</h1><button class="btn" data-a="closesum">Назад</button>';
  const rows = sessionRows(sid);
  const times = exTimes(sid, s.warmEnd || s.start).filter(t => t.sec > 0);
  const mx = Math.max(1, ...times.map(t => t.sec)), avg = times.length ? times.reduce((a, t) => a + t.sec, 0) / times.length : 0;
  const prs = rows.filter(r => r.pr);
  let h = '<div class="date">' + dlabel(s.d) + '</div><h1>Тренировка завершена</h1>';
  h += '<div class="sum"><div class="k">' + esc(cxLabel(s.cx)).toUpperCase() + '</div><div class="bg num">' + s.min + ' <small>мин всего</small></div><div class="s2">рабочая часть ' + s.wmin + ' мин' + (s.warmEnd ? ' · разминка ' + Math.max(0, Math.round((s.warmEnd - s.start) / 60000)) + ' мин' : '') + '</div></div>';
  h += '<div class="kp"><div><b class="num">' + s.sets + '</b><small>подходов</small></div><div><b class="num">' + s.prs + '</b><small>рекордов</small></div><div><b class="num">' + (s.subs + s.skips) + '</b><small>замен / пропусков</small></div></div>';
  if (times.length) {
    h += '<h2>Время по упражнениям</h2><div class="bars">' + times.map(t => '<div class="bar"><span>' + esc(EX(t.ex).name) + '</span><span class="t"><i class="' + (t.sec > avg * 1.4 ? 'long' : '') + '" style="width:' + Math.round(t.sec / mx * 100) + '%"></i></span><span class="num">' + Math.round(t.sec / 60) + ' м</span></div>').join('') + '</div>';
  }
  if (prs.length) h += '<h2>Рекорды</h2><div class="bars prs">' + prs.map(r => '🏆 <b>' + esc(EX(r.ex).name) + '</b> — ' + fn(r.w) + '×' + r.r + (r.m === 'sec' ? 'с' : '') + (r.e1 ? ' (1ПМ ≈ ' + fn(r.e1) + ')' : '')).join('<br>') + '</div>';
  h += '<div class="field"><label>Заметка к тренировке</label><textarea data-f="snote" data-sid="' + esc(sid) + '" placeholder="Как самочувствие, что мешало…">' + esc(s.note || '') + '</textarea></div>';
  h += '<div class="syncline ' + syncState() + '" id="syncline">' + esc(syncText()) + '</div>';
  h += '<button class="btn or" style="margin-top:14px" data-a="closesum">Готово</button>';
  return h;
}

/* ---------- прогресс ---------- */
function exSeries(id) { return exSessions(id).map(s => ({ d: s.d, v: Math.max(0, ...s.sets.map(r => isWork(r) ? valOf(r) : 0)), sets: s.sets })); }
function viewProgress() {
  const ids = S.pool.filter(p => !p.arch || (idx()[p.id] || []).length).map(p => p.id).filter(id => (idx()[id] || []).length);
  let h = '<h1>Прогресс</h1>';
  const since = addDays(dstr(), -14);
  const prs = S.log.filter(r => r.pr && r.d >= since).sort((a, b) => b.ts - a.ts).slice(0, 6);
  if (prs.length) h += '<h2>Рекорды за 2 недели</h2><div class="bars prs">' + prs.map(r => '🏆 ' + dlabel(r.d) + ' · <b>' + esc(EX(r.ex).name) + '</b> — ' + fn(r.w) + '×' + r.r + (r.m === 'sec' ? 'с' : '')).join('<br>') + '</div>';
  h += '<h2>Упражнения</h2>';
  if (!ids.length) h += '<div class="hint">Здесь появятся графики, когда будут записаны первые подходы.</div>';
  const order = []; S.complexes.forEach(c => c.items.forEach(i => { const u = lastVariant(i.ex); if (!order.includes(u)) order.push(u); }));
  const sorted = ids.slice().sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  for (const id of sorted) {
    const e = EX(id), ser = exSeries(id), vals = ser.map(s => s.v), last = ser[ser.length - 1];
    const dlt = vals.length > 1 && vals[0] > 0 ? Math.round((vals[vals.length - 1] / vals[0] - 1) * 100) : null;
    h += '<button class="prow" data-a="pdetail" data-v="' + id + '"><span><b>' + esc(e.name) + '</b><small>' + dlabel(last.d) + ' · ' + last.sets.filter(isWork).slice(0, 4).map(r => fn(r.w) + '×' + r.r).join(', ') + '</small>' + (dlt != null && dlt > 0 ? '<span class="up">+' + dlt + '%</span>' : '') + '</span>' + spark(vals.slice(-10)) + '</button>';
  }
  return h;
}

/* ---------- вес ---------- */
function viewWeight() {
  const d = dstr(), cur = weightOn(d);
  const val = wval();
  let h = '<h1>Вес</h1><div class="card wcard"><small style="color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.05em">УТРО · ' + dlabel(d).toUpperCase() + '</small>' +
    '<div class="steps" style="grid-template-columns:1fr;margin-top:4px"><div class="step" style="border:0;padding:0"><div class="n"><button class="pm" data-a="wday" data-v="-0.1">−</button><button class="v num" data-a="wnumday" data-v="' + d + '">' + fn(val) + '</button><button class="pm" data-a="wday" data-v="0.1">+</button></div></div></div>' +
    '<button class="btn or" style="margin-top:10px" data-a="wsave" data-v="' + d + '">' + (cur != null ? 'Обновить запись' : 'Записать вес') + '</button></div>';
  const a7 = avgRange(addDays(d, -6), d), p7 = avgRange(addDays(d, -13), addDays(d, -7));

    const ch = p7 != null ? a7 - p7 : null;
    let st = 'в коридоре', cl = 'ok';
    if (a7 < co.lo - 0.15) { st = 'ниже коридора'; cl = 'wait'; } else if (a7 > co.hi + 0.15) { st = 'выше коридора'; cl = 'wait'; }
    h += '<div class="card"><div class="kp" style="margin:0"><div><b class="num">' + fn(r1(a7)) + '</b><small>среднее 7 дн.</small></div><div><b class="num">' + (ch == null ? '—' : (ch > 0 ? '+' : '') + fn(r2(ch))) + '</b><small>к прошлой неделе</small></div><div><b class="num">' + fn(r1(co.lo)) + '–' + fn(r1(co.hi)) + '</b><small>коридор сегодня</small></div></div><div class="syncline ' + cl + '">Среднее: ' + st + '</div></div>';
  }
  const from = addDays(d, -41);
  const ws = S.weights.filter(w => w.d >= from);
  if (ws.length >= 2) {
    const x = s => daysBetween(from, s);
    const avgPts = ws.map(w => [x(w.d), avgRange(addDays(w.d, -6), w.d)]).filter(p => p[1] != null);
    const days = [x(ws[0].d), x(d)];
    const band = { lo: days.map(k => [k, corridor(addDays(from, k)).lo]), hi: days.map(k => [k, corridor(addDays(from, k)).hi]) };
    h += '<h2>Динамика · 6 недель</h2><div class="card">' + lineChart([{ pts: ws.map(w => [x(w.d), w.w]), color: 'var(--muted)', dots: true, r: 2.5, width: 1.2 }, { pts: avgPts, color: 'var(--or)', width: 2.5 }], band, 340, 170, [dlabel(ws[0].d), dlabel(d)]) + '<div class="hint" style="margin:4px 0 0">серые точки — взвешивания · оранжевая — среднее за 7 дней · зелёная полоса — целевой коридор</div></div>';
  }
  const rec = S.weights.slice(-10).reverse();
  if (rec.length) h += '<h2>Записи</h2><div class="recent">' + rec.map(w => '<button class="rrow" data-a="wnumday" data-v="' + w.d + '"><b>' + dlabel(w.d) + '</b><span>' + dow(w.d) + '</span><b class="num">' + fn(w.w) + '</b></button>').join('') + '</div>';
  return h;
}

/* ---------- каркас ---------- */

function saveWeight(d, w) {

  if (ex) { ex.w = w; ex.sy = 0; } else { S.weights.push({ d, w, sy: 0 }); S.weights.sort((a, b) => a.d < b.d ? -1 : 1); }
  qop({ op: 'weight', d, w });

function refreshSession(sid) {
  const s = S.sessions.find(x => x.sid === sid); if (!s) return;
  const rows = sessionRows(sid);
  s.sets = rows.filter(isWork).length; s.prs = rows.filter(r => r.pr).length;

function logSet() {
  const A = S.active, it = cur(), id = it.use || it.ex, e = EX(id), d = draft(it);
  if (e.load !== 'bodyweight' && !(d.w > 0)) { toast('Укажи вес'); return; }
  if (!(d.r > 0)) { toast(e.metric === 'sec' ? 'Укажи секунды' : 'Укажи повторы'); return; }
  const rec = makeRec(A, it, d);
  it.pnote = '';
  S.log.push(rec); touchLog(); qSet(rec);
  let plan = it.rest, jump = -1;
  if (d.ty === 'рест-пауза') plan = 20;
  if (it.grp && d.ty !== 'дроп') {
    const mem = A.items.map((x, k) => k).filter(k => A.items[k].grp === it.grp && !A.items[k].skip);
    const w = itemWork(A, it);
    const order = mem.slice(mem.indexOf(A.cur) + 1).concat(mem.slice(0, mem.indexOf(A.cur)));
    // следующий участник связки, который в этом круге ещё не делал подход
    const pend = order.find(k => itemWork(A, A.items[k]) < Math.min(w, A.items[k].sets));
    plan = Math.max(...mem.map(k => A.items[k].rest));
    if (pend != null) { jump = pend; plan = 0; }
    else {
      const first = mem.find(k => itemWork(A, A.items[k]) < A.items[k].sets);
      if (first != null && first !== A.cur) jump = first;
    }
  }
  A.restStart = Date.now(); A.restPlan = plan; A.beeped = false;
  if (jump >= 0) { A.cur = jump; scrollEx(); }
  UI.ask = '';
  save(); render();
  if (rec.pr) toast('🏆 Новый рекорд!');
}

  confirmok: () => { const cb = UI.sheet.cb; if (cb) cb(); },
  shclose: () => closeSheet(),
  numok: () => { const v = parseNum(fv('v', '')); if (v == null) { toast('Введи число'); return; } const cb = UI.sheet.cb; closeSheet(); cb(v); render(); },
  closesum: () => { UI.sum = null; window.scrollTo(0, 0); render(); },
  opensum: el => { UI.tab = 'train'; UI.sum = el.dataset.v; window.scrollTo(0, 0); render(); },
  wsave: el => { saveWeight(el.dataset.v, wval()); UI.wDraft = null; render(); },
  wday: el => { UI.wDraft = r1(wval() + (+el.dataset.v)); render(); },
  wnumday: el => {
    const d = el.dataset.v;
    if (d === dstr()) openNum('Вес, кг', fn(wval()), v => { UI.wDraft = r1(v); });
    else openNum('Вес за ' + dlabel(d) + ', кг', fn(weightOn(d)), v => saveWeight(d, v));
  },
  pdetail: el => openSheet({ kind: 'pd', id: el.dataset.v }),
  saveconn: () => {
    const c = UI.conn || {}, url = (c.url != null ? c.url : S.cfg.url).trim(), tk = (c.token != null ? c.token : S.cfg.token).trim();
    if (url && !/^(https:\/\/script\.google(usercontent)?\.com\/|http:\/\/(localhost|127\.0\.0\.1)[:\/])/.test(url)) { toast('Адрес должен начинаться с https://script.google.com/'); return; }
    S.cfg.url = url; S.cfg.token = tk; S.sync.err = ''; UI.conn = null; save(); render();
    if (url && tk) { toast('Сохранено, проверяю связь…'); flush().then(() => pull(true)); } else toast('Сохранено');
  },
  pullnow: () => { pull(true); },
  flushnow: () => { S.sync.err = ''; flush(); },
  progimport: () => openSheet({ kind: 'prog' }),
  progcheck: () => { collect(); UI.sheet.pr = parseProgram(fv('ptxt', '')); renderSheet(); },
  progok: () => { applyProgram(UI.sheet.pr); closeSheet(); save(); render(); toast('Программа загружена'); },
  sound: () => { S.cfg.sound = !S.cfg.sound; if (S.cfg.sound) { unlockAudio(); beep(); } save(); render(); },
  backup: () => {
    const o = { log: S.log, weights: S.weights, sessions: S.sessions, pool: S.pool, complexes: S.complexes, cfg: Object.assign({}, S.cfg, { token: '', url: '' }) };
    const t = JSON.stringify(o);
    const done = () => toast('Копия скопирована в буфер обмена');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => toast('Не удалось скопировать'));
    else toast('Не удалось скопировать');
  }
};

document.addEventListener('click', e => {
  const sh = $('#sheet');
  if (e.target === sh) { closeSheet(); return; }
  const el = e.target.closest('[data-a]'); if (!el) return;
  collect(); unlockAudio();
  const a = el.dataset.a;
  if (a !== 'skip' && UI.ask) UI.ask = '';
  const f = ACT[a]; if (f) f(el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f === 'q' && UI.sheet && UI.sheet.kind === 'pick') {
    UI.sheet.f.q = t.value; const l = $('#plist'); if (l) l.innerHTML = pickList();
  }
  if (t.dataset && (t.dataset.f === 'url' || t.dataset.f === 'token') && !UI.sheet) { UI.conn = UI.conn || {}; UI.conn[t.dataset.f] = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f === 'snote') {
    const s = S.sessions.find(x => x.sid === t.dataset.sid); if (s) { s.note = t.value; qSession(s); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && UI.sheet && UI.sheet.kind === 'num' && e.target.tagName === 'INPUT') { e.preventDefault(); collect(); ACT.numok(); }
});

/* ---------- запуск ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    wake(); tick(); flush();
    if (S.cfg.url && Date.now() - (S.sync.last || 0) > 5 * 60000 && !S.active) pull(false);
  }
});
window.addEventListener('online', () => { flush(); });
window.addEventListener('pagehide', save);
render();
setInterval(tick, 1000);
setInterval(() => { if (S.outbox.length) flush(); }, 30000);
if (S.active) wake();
if (S.cfg.url && S.cfg.token) { flush().then(() => { if (!S.active) pull(false); }); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });


</script>
</body>
</html>
